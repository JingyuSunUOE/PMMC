name: Release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_image:
        description: Cold build and test app and IAM without publishing
        type: boolean
        default: false
      publish_images:
        description: Publish candidate images for this exact branch commit and attest the lock
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce and verify the exact public source archive
        run: |
          python scripts/release_source.py archive --output "$RUNNER_TEMP/source.tar.gz"
          python scripts/release_source.py archive --output "$RUNNER_TEMP/source-repeat.tar.gz"
          cmp "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/source-repeat.tar.gz"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          python -B docker/verify_public_source.py .
          python -m pip install build pytest pillow 'pydantic>=2,<3' pyyaml
          python -m build --outdir "$RUNNER_TEMP/distributions"
          ./scripts/pmmc --help
          python -m compileall -q src scripts alembic
      - name: Install fixture encryption CLI in the disposable CPU runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          age --version
          command -v age-keygen
      - name: Offline host, Kubernetes and Git publication fixtures
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q tests/test_release_host.py tests/test_release_publication.py
          tests/test_release_kubernetes.py
      - name: Exercise private installer and real age from verified extracted source
        env:
          PMMC_REQUIRE_REAL_AGE: '1'
          PYTHONPATH: src
        run: |
          cd "$RUNNER_TEMP/source"
          python -B -m pytest -q tests/test_private_deploy.py

  kind-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create a disposable Kind cluster with dynamic local storage
        run: |
          export KUBECONFIG="$RUNNER_TEMP/pmmc-kind-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          go install sigs.k8s.io/kind@v0.30.0
          "$(go env GOPATH)/bin/kind" create cluster --name pmmc-release-ci --wait 180s --kubeconfig "$KUBECONFIG"
      - name: Write and recover independent database and object-store markers after pod replacement
        run: PYTHONPATH=src python3 -m scripts.kind_persistence
      - name: Dispose of the CI cluster
        if: always()
        run: |
          if test -x "$(go env GOPATH)/bin/kind"; then
            "$(go env GOPATH)/bin/kind" delete cluster --name pmmc-release-ci
          fi

  linux-image:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && (inputs.runtime_image || inputs.publish_images)
    needs: [clean-source, kind-storage]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare immutable public build context
        run: |
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/candidate"
          python3 scripts/release_source.py archive --output "$RUNNER_TEMP/candidate/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/candidate/source.tar.gz" -C "$RUNNER_TEMP/source"
          python3 -B "$RUNNER_TEMP/source/docker/verify_public_source.py" "$RUNNER_TEMP/source"
          echo "APP=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IAM=ghcr.io/${GITHUB_REPOSITORY,,}-iam" >> "$GITHUB_ENV"
          echo "TAG=sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Reclaim preinstalled toolchains after setup on the disposable hosted VM
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          df -h /var/lib/docker
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/chromium /opt/hostedtoolcache
          df -h /var/lib/docker
      - name: Cold build the app from public source
        run: |
          docker build --pull --no-cache --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$APP:$TAG" "$RUNNER_TEMP/source"
      - name: Exercise offline scientific and recovery contracts
        run: >-
          docker run --rm --network none "$APP:$TAG" python -m pytest -q
          tests/test_questioner_release_w.py tests/test_release_r_joint_relevance.py
          tests/test_release_inputs.py tests/test_release_reporting.py
          tests/test_step8_campaign.py tests/test_step8_journal_storage.py
          tests/test_step8_typed_gold.py
          tests/test_release_selected_dag.py tests/test_release_data.py
          tests/test_release_plan_budget.py tests/test_release_plan_controller.py
          tests/test_release_runtime_topology.py
      - name: Authenticate to GHCR for explicit publication only
        if: inputs.publish_images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push candidate app and resolve exact manifest
        if: inputs.publish_images
        run: |
          docker push "$APP:$TAG"
          APP_REF=$(docker image inspect "$APP:$TAG" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$APP@sha256:" '[.[] | select(startswith($prefix))] | unique | select(length == 1)[0]')
          docker buildx imagetools inspect "$APP_REF"
          echo "APP_REF=$APP_REF" >> "$GITHUB_ENV"
      - name: Cold build IAM from its separate deny-all context
        run: |
          cd "$RUNNER_TEMP/source/docker/minio"
          docker build --no-cache --platform linux/amd64 -f step8.Dockerfile \
            --build-arg "PMMC_IMAGE=${APP_REF:-$APP:$TAG}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IAM:$TAG" .
          docker run --rm --network none --entrypoint mc "$IAM:$TAG" --version | grep RELEASE.2025-04-16T18-13-26Z
      - name: Push candidate IAM and bind digests to source
        if: inputs.publish_images
        run: |
          docker push "$IAM:$TAG"
          IAM_REF=$(docker image inspect "$IAM:$TAG" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$IAM@sha256:" '[.[] | select(startswith($prefix))] | unique | select(length == 1)[0]')
          docker buildx imagetools inspect "$IAM_REF"
          /usr/bin/python3 scripts/release_images.py --app "$APP_REF" --iam "$IAM_REF" --output "$RUNNER_TEMP/candidate/images.lock.json"
          cd "$RUNNER_TEMP/candidate"
          sha256sum images.lock.json source.tar.gz > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Sign source and lock provenance for this commit
        if: inputs.publish_images
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-checksums: ${{ runner.temp }}/candidate/SHA256SUMS
      - name: Hand candidate assets to the parent release reviewer
        if: inputs.publish_images
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
