name: Release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_image:
        description: Build the full Linux runtime and run offline regression tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify the public archive, not a private working tree
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          python -B docker/verify_public_source.py .
          python -m pip install build pytest
          python -m build --outdir "$RUNNER_TEMP/distributions"
          ./scripts/pmmc --help
          python -m compileall -q src scripts alembic
  linux-image:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_image
    needs: clean-source
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Make room for the pinned CUDA image on the disposable GitHub VM
        run: |
          df -h /var/lib/docker
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/chromium /opt/hostedtoolcache
          df -h /var/lib/docker
      - name: Build without any historical PMMC image or private inputs
        run: docker build -t pmmc-release-candidate .
      - name: Exercise offline scientific and recovery contracts
        run: >-
          docker run --rm --network none pmmc-release-candidate python -m pytest -q
          tests/test_questioner_release_w.py tests/test_release_r_joint_relevance.py
          tests/test_release_inputs.py tests/test_release_reporting.py
          tests/test_step8_campaign.py tests/test_step8_journal_storage.py
          tests/test_step8_typed_gold.py
