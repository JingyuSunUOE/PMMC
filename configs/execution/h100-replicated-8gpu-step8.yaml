execution_protocol: pmmc-throughput-v1
schedule: model-stage-major-v1
unit_preparation:
  workers: 32
  max_tasks_per_child: 16
  cache_policy: read_write
  counter_backend: qwen-vl-cached-exact-v1
  local_asset_cache: true
qbank:
  text_query_batch_size: 64
  multimodal_query_batch_size: 16
  embedding_concurrency: 32
  score_concurrency: 8
checkpoint:
  policy: milestone
  interval_seconds: 1800
  completed_jobs_interval: 250
  retain_count: 2
progress:
  protocol: weighted-hierarchical-progress-v2
replicas:
  # The shared 9B compiler pool also serves 9B answers, grounding, and reranking.
  compiler: 8
  text_embedding: 8
  contrastive_embedding: 8
  multimodal_embedding: 8
  # Frozen TP2x4, gated by a measured capacity receipt; never degrade to one replica.
  answer: 4
  judge: 8
