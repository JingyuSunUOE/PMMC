launcher_schema_version: 0.3.0
experiment_name: five-foundational-baselines-dev
target: foundational_baselines
mode: dev
methods:
  - full_context_captions
  - full_context_raw_images
  - caption_text_rag
  - contrastive_multimodal_rag
  - native_multimodal_rag
models:
  answer_model: answer-qwen3.5-9b
  judge_model: judge-qwen3.5-9b
  text_embedding_model: qwen3-embedding-8b
  contrastive_embedding_model: siglip2-so400m-patch14-384
  multimodal_embedding_model: qwen3-vl-embedding-8b
selection:
  datasets: [memlens]
  question_types: []
  source_categories: []
  scenario_ids: []
  query_ids: []
  limit: 5
  seed: 0
  shard_count: 1
  shard_index: 0
  include_excluded: false
infrastructure:
  mode: self_contained
  wait_timeout_seconds: 300
  migrate_database: true
  sync_assets: true
  archive_snapshot: false
progress:
  report_interval_seconds: 10
runtime_profile_path: configs/runtime/h100-dev.yaml
execution_profile_path: configs/execution/h100-throughput-v1.yaml
model_registry_overlays: []
download_policy: auto
model_verification_policy: identity_only
calibration_policy: skip
evaluate: true
retrieval_top_k: 50
answer_top_k: 5
total_context_tokens: 32768
reserved_output_tokens: 1024
answer_batch_size: 2
embedding_batch_size: 8
multimodal_embedding_batch_size: 2
model_concurrency: 2
metadata:
  paper_result: false
