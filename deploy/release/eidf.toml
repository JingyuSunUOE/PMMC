# Copy to a private operator location. These placeholders are NOT deployable.
profile = "eidf"
instance = "pmmc-release"

[images]
app = "REPLACE_WITH_PINNED_APP_IMAGE"
iam = "REPLACE_WITH_PINNED_STEP8_IAM_IMAGE"
postgres = "REPLACE_WITH_PINNED_PG16_PGVECTOR_IMAGE"
minio = "quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e"

[cluster]
context = "REPLACE_WITH_KUBECTL_CONTEXT"
namespace = "REPLACE_WITH_NAMESPACE"
queue = "REPLACE_WITH_LOCALQUEUE"
shared_pvc = "REPLACE_WITH_BOUND_RWX_CLAIM"
storage_class = "REPLACE_WITH_APPROVED_RWO_CLASS"
cpu_budget = 100
admission_timeout_seconds = 600

# Pre-existing, disjoint subdirectories of shared_pvc, not node-local paths.
[mounts]
inputs = "release/inputs"
outputs = "release/outputs"
artifacts = "release/artifacts"
cache = "release/hf"

[native]
benchmark_config = "/workspace/configs/release/prepare-models.yaml"
# release_profile = "/pmmc-inputs/release-profile.yaml"
# rate_card = "/pmmc-inputs/provider-rate-card.json"

[models]
allow_download = true
create_lock = false
use_hf_token = false
calibrate = true
