[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmmc"
version = "0.2.0"
description = "Prospective Multimodal Memory Compilation for long-term LVLM agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.13"
authors = [
  { name = "PMMC Contributors" }
]
keywords = [
  "agent-memory",
  "multimodal-memory",
  "lvml-agent",
  "rag",
  "long-term-memory",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate",
  "aiohttp",
  "alembic>=1.13,<2",
  "anthropic",
  "boto3>=1.35,<2",
  "datasets",
  "evaluate",
  "faiss-cpu",
  "greenlet>=3,<4",
  "hydra-core",
  "huggingface-hub>=1.21,<1.22",
  "httpx",
  "ijson>=3,<4",
  "json-repair",
  "jsonlines",
  "langchain",
  "langchain-core",
  "langchain-openai",
  "langfuse",
  "langgraph",
  "litellm[proxy]==1.92.0",
  "matplotlib",
  "mypy",
  "nltk",
  "nvidia-ml-py",
  "numpy",
  "omegaconf",
  "openai",
  "opencv-python-headless",
  "orjson",
  "packaging>=24.2",
  "pandas",
  "pgvector>=0.3,<1",
  "pillow",
  "plotly",
  "pre-commit",
  "psutil",
  "psycopg[binary]>=3.2,<4",
  "pyarrow",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pytest",
  "pytest-cov",
  "python-dotenv",
  "pyyaml",
  "qwen-vl-utils",
  "rank-bm25",
  "requests",
  "rich",
  "rouge-score",
  "ruff",
  "sacrebleu",
  "scikit-learn",
  "seaborn",
  "sentence-transformers",
  "safetensors>=0.6.2",
  "sqlalchemy>=2,<3",
  "structlog",
  "tenacity",
  "tiktoken",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "tqdm",
  "transformers>=5.5.3,<6",
  "typer",
  "types-PyYAML",
  "vllm==0.24.0",
  "zstandard>=0.23,<1",
]

[project.scripts]
pmmc = "pmmc.cli:app"

[project.urls]
Repository = "https://github.com/JingyuSunUOE/PMMC"
Issues = "https://github.com/JingyuSunUOE/PMMC/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmmc = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests/test_release_*.py", "tests/test_questioner_release_w.py", "tests/test_step8_campaign.py", "tests/test_step8_journal_storage.py", "tests/test_step8_typed_gold.py"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
  "benchmark_assets: integration tests requiring local third-party benchmark payloads",
  "persistence_integration: integration tests requiring Postgres",
  "object_store_integration: integration tests requiring S3-compatible object storage",
  "baseline_persistence_integration: Step 5A tests requiring Postgres and MinIO",
  "model_gateway_integration: explicit paid/service smoke tests for LiteLLM, vLLM, and Langfuse",
  "full_context_persistence_integration: Step 5B tests requiring Postgres and MinIO",
  "full_context_model_integration: opt-in live Step 5B answer-model smoke tests",
  "managed_runtime_integration: Step 5R tests requiring Postgres and MinIO",
  "managed_runtime_gpu: Step 5R tests requiring real NVIDIA GPUs and locked models",
  "rag_persistence_integration: Step 5C tests requiring Postgres and MinIO",
  "rag_model_integration: opt-in live Step 5C embedding and answer-model smoke tests",
  "baseline_evaluation_integration: Step 5D tests requiring Postgres and MinIO",
  "baseline_evaluation_gpu: opt-in live Step 5D judge-model smoke tests",
  "compiler_persistence_integration: Step 6A tests requiring Postgres",
  "questioner_persistence_integration: Step 6B tests requiring Postgres and MinIO",
  "questioner_model_integration: opt-in live Step 6B compiler and embedding smoke tests",
  "step6b4_persistence_integration: Step 6B.4 tests requiring Postgres",
  "step6b5_persistence_integration: Step 6B.5 tests requiring Postgres",
  "step6c_persistence_integration: Step 6C tests requiring Postgres",
  "step6c2_persistence_integration: Step 6C.2 tests requiring Postgres",
  "step6d_persistence_integration: Step 6D tests requiring Postgres",
  "step7_persistence_integration: Step 7 tests requiring Postgres and MinIO",
  "step7b_persistence_integration: Step 7B tests requiring Postgres and MinIO",
]
filterwarnings = [
  "error::pydantic.warnings.PydanticDeprecatedSince20",
]
